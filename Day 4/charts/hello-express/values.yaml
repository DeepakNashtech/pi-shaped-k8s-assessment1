# Default values for hello-express Helm chart
# This is a YAML-formatted file.

# Number of replicas for the deployment
replicaCount: 3

# Container image configuration
image:
  repository: deepaknash/hello-docker
  tag: assessment1
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: NodePort
  port: 80
  targetPort: 8080
  nodePort: 30080

# Resource limits and requests
resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

# Node affinity and tolerations are hardcoded in the template
# but could be parameterized further if needed